[analysis]
mode = "fast"
max_hypotheses = 3
max_tool_calls = 8
max_critic_cycles = 1
minimum_sample_size = 20

[performance]
timeout_seconds = 15
parallel_tools = true

[llm]
provider = "disabled"
temperature = 0.0
max_retries = 2

[evaluation]
repetitions = 3

[persistence]
database_url = "sqlite:///:memory:"

[data_intake]
identifier_name_tokens = ["id", "identifier", "uuid", "identificador"]
identifier_unique_ratio = 0.95
identifier_max_length = 128
categorical_max_unique = 20
categorical_unique_ratio = 0.1
categorical_max_length = 64
temporal_parse_ratio = 1.0
temporal_formats = ["%Y-%m-%d", "%Y-%m-%dT%H:%M:%S", "%Y-%m-%d %H:%M:%S", "%Y-%m-%dT%H:%M:%S%z"]
text_name_tokens = ["description", "comment", "notes", "descripcion", "comentario"]

[uploads]
# Zero disables the application-level dataset upload size limit.
max_dataset_bytes = 0
max_dictionary_bytes = 1048576
chunk_size_bytes = 65536
