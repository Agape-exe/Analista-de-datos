[analysis]
mode = "fast"
max_hypotheses = 3
max_tool_calls = 8
max_critic_cycles = 1
minimum_sample_size = 20

[performance]
timeout_seconds = 15
parallel_tools = true

[llm]
provider = "disabled"
temperature = 0.0
max_retries = 2

[evaluation]
repetitions = 3

[persistence]
database_url = "sqlite:///:memory:"

[data_intake]
identifier_name_tokens = ["id", "identifier", "uuid", "identificador"]
identifier_unique_ratio = 0.95
identifier_max_length = 128
categorical_max_unique = 20
categorical_unique_ratio = 0.1
categorical_max_length = 64
temporal_parse_ratio = 1.0
temporal_formats = ["%Y-%m-%d", "%Y-%m-%dT%H:%M:%S", "%Y-%m-%d %H:%M:%S", "%Y-%m-%dT%H:%M:%S%z", "%d/%m/%Y"]
text_name_tokens = ["description", "comment", "notes", "descripcion", "comentario"]

[uploads]
# Zero disables the application-level dataset upload size limit.
max_dataset_bytes = 0
max_dictionary_bytes = 1048576
chunk_size_bytes = 65536

[eda]
significance_level = 0.05
top_relationships = 10
max_pairs = 1000
max_categories = 50
max_cached_datasets = 8
top_categories = 10
max_histogram_bins = 30
outlier_iqr_multiplier = 1.5
outlier_mad_threshold = 3.5
max_outlier_examples = 20
normality_alpha = 0.05
mutual_information_neighbors = 3
max_scatter_points = 2000
max_box_outliers = 200
random_seed = 0
